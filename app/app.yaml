command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]

# Runtime configuration injected at bundle deploy time.
# Update these values when deploying to a new target workspace.
# SERVING_ENDPOINT_NAME is updated by setup.py after the MAS supervisor is created.
env:
  - name: DATABRICKS_WAREHOUSE_ID
    value: "ff4426268a522c62"
  - name: DATABRICKS_CATALOG
    value: "fna_control_tower"
  - name: DATABRICKS_SCHEMA
    value: "finance_and_accounting"
  - name: ESCALATION_RECIPIENT
    value: "akash.s@databricks.com"
  - name: SERVING_ENDPOINT_NAME
    value: "mas-2dcd8d5a-endpoint"
  - name: LAKEBASE_INSTANCE_NAME
    value: "finance-ops-db"

resources:
  - name: sql-warehouse
    sql_warehouse:
      id: "ff4426268a522c62"
      permission: CAN_USE
  - name: claude-endpoint
    serving_endpoint:
      name: "databricks-claude-sonnet-4-5"
      permission: CAN_QUERY
  - name: mas-supervisor
    serving_endpoint:
      name: "mas-2dcd8d5a-endpoint"
      permission: CAN_QUERY
  - name: lakebase-conn
    database:
      instance_name: "finance-ops-db"
      database_name: "databricks_postgres"
      permission: CAN_CONNECT_AND_CREATE
