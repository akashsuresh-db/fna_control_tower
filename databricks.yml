bundle:
  name: fna-control-tower
  engine: direct

variables:
  catalog:
    description: "Unity Catalog name for all tables and volumes"
    default: fna_control_tower

  schema:
    description: "Schema within the catalog for finance & accounting data"
    default: finance_and_accounting

  escalation_recipient:
    description: "Email address for AP escalation alerts"
    default: "akash.s@databricks.com"

  genie_space_id:
    description: "Genie Space ID (leave empty to skip; Genie Spaces cannot be bundle-created)"
    default: ""

  serving_endpoint_name:
    description: "MAS supervisor model serving endpoint (created by ETL task 09)"
    default: "mas-fna-supervisor"

  claude_endpoint_name:
    description: "Claude model serving endpoint (platform-provided foundation model)"
    default: "databricks-claude-sonnet-4-5"

  lakebase_instance_name:
    description: "Lakebase (Postgres) instance name for persistent chat/approval/call-log storage"
    default: "finance-ops-db"

include:
  - resources/*.yml

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/dev

  fevm:
    # No mode: development — resources use exact project-specific names with no dev prefix.
    # All infrastructure is bundle-created fresh; no pre-existing workspace resources referenced.
    workspace:
      host: https://fevm-fna-control-tower-ws.cloud.databricks.com
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/fevm
    variables:
      catalog: fna_control_tower_ws_catalog
      escalation_recipient: akash.s@databricks.com
      serving_endpoint_name: mas-2dcd8d5a-endpoint
      claude_endpoint_name: databricks-claude-sonnet-4-5
      # schema:                finance_and_accounting
      # lakebase_instance_name: finance-ops-db

  prod:
    mode: production
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/prod
    permissions:
      - group_name: users
        level: CAN_MANAGE
    resources:
      pipelines:
        fna_dlt_pipeline:
          development: false
