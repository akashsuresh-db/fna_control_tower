resources:
  jobs:
    fna_etl_workflow:
      name: "FnA Control Tower - ETL Workflow"
      tags:
        project: fna-control-tower
        domain: finance-and-accounting

      tasks:
        # Step 1: Generate synthetic data (bronze tables + UC volume files)
        - task_key: data_generation
          notebook_task:
            notebook_path: ../notebooks/00_Setup_and_Data_Generation.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
            source: WORKSPACE
          environment_key: default
          timeout_seconds: 3600

        # Step 2: DLT pipeline (bronze → silver with expectations + quarantine)
        - task_key: dlt_bronze_to_silver
          depends_on:
            - task_key: data_generation
          pipeline_task:
            pipeline_id: ${resources.pipelines.fna_dlt_pipeline.id}
            full_refresh: true

        # Step 3a: Gold layer - Procure-to-Pay
        - task_key: gold_p2p
          depends_on:
            - task_key: dlt_bronze_to_silver
          notebook_task:
            notebook_path: ../notebooks/02_Gold_Layer_P2P.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
            source: WORKSPACE
          environment_key: default
          timeout_seconds: 1800

        # Step 3b: Gold layer - Order-to-Cash (parallel with P2P and R2R)
        - task_key: gold_o2c
          depends_on:
            - task_key: dlt_bronze_to_silver
          notebook_task:
            notebook_path: ../notebooks/03_Gold_Layer_O2C.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
            source: WORKSPACE
          environment_key: default
          timeout_seconds: 1800

        # Step 3c: Gold layer - Record-to-Report (parallel with P2P and O2C)
        - task_key: gold_r2r
          depends_on:
            - task_key: dlt_bronze_to_silver
          notebook_task:
            notebook_path: ../notebooks/04_Gold_Layer_R2R.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
            source: WORKSPACE
          environment_key: default
          timeout_seconds: 1800

        # Step 4: Create unified KPI view for Genie
        - task_key: create_kpi_view
          depends_on:
            - task_key: gold_p2p
            - task_key: gold_o2c
            - task_key: gold_r2r
          notebook_task:
            notebook_path: ../notebooks/06_Create_KPI_View.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
            source: WORKSPACE
          environment_key: default
          timeout_seconds: 600

        # Step 5: Create Genie Space via API (idempotent — reuses existing space if title matches)
        - task_key: create_genie_space
          depends_on:
            - task_key: create_kpi_view
          notebook_task:
            notebook_path: ../notebooks/07_Create_Genie_Space.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${resources.sql_warehouses.fna_warehouse.id}
            source: WORKSPACE
          environment_key: mas_setup
          timeout_seconds: 600

        # Step 6: Attach gold tables + finance instructions to the Genie Space
        - task_key: configure_genie_space
          depends_on:
            - task_key: create_genie_space
          notebook_task:
            notebook_path: ../notebooks/08_Configure_Genie_Space.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${resources.sql_warehouses.fna_warehouse.id}
              genie_space_id: ""  # read from task value published by create_genie_space
            source: WORKSPACE
          environment_key: mas_setup
          timeout_seconds: 600

        # Step 7: Register LangGraph agent (Claude + GenieTool) and deploy as MAS endpoint
        - task_key: deploy_mas_supervisor
          depends_on:
            - task_key: configure_genie_space
          notebook_task:
            notebook_path: ../notebooks/09_Deploy_MAS_Supervisor.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              serving_endpoint_name: ${var.serving_endpoint_name}
              claude_endpoint_name: ${var.claude_endpoint_name}
              genie_space_id: ""  # read from task value published by create_genie_space
            source: WORKSPACE
          environment_key: mas_setup
          timeout_seconds: 3600

      environments:
        - environment_key: default
          spec:
            client: "1"

        - environment_key: mas_setup
          spec:
            client: "1"
            dependencies:
              - databricks-sdk>=0.28
              - langchain-databricks>=0.3
              - langgraph>=0.2
              - databricks-agents>=0.5
              - mlflow>=2.17
              - requests
