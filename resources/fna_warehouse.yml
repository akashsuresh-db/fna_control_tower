resources:
  sql_warehouses:
    fna_warehouse:
      name: "FnA Control Tower Warehouse"
      cluster_size: "Small"
      enable_serverless_compute: true
      auto_stop_mins: 0
      warehouse_type: PRO
      permissions:
        - level: CAN_USE
          group_name: users
        - level: CAN_USE
          service_principal_name: ${resources.apps.fna_control_tower_app.service_principal_client_id}
